name: Comment Streamlit Link

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Comment deployment link on PR
        uses: actions/github-script@v7
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        with:
          script: |
            const marker = '<!-- flight-deal-brief-streamlit-link -->';
            const run = context.payload.workflow_run;
            const pr = run.pull_requests[0];

            if (!pr) {
              core.info('No pull request attached to this workflow run.');
              return;
            }

            const appUrl = process.env.STREAMLIT_APP_URL;
            const body = (appUrl
              ? [
                  marker,
                  '',
                  `Flight Deal Brief build passed for \`${run.head_branch}\`.`,
                  '',
                  'Streamlit Community Cloud deploys from the connected GitHub branch. If this PR is merged into the deployed branch, the app will refresh at:',
                  '',
                  appUrl,
                  '',
                  `Workflow run: ${run.html_url}`,
                ]
              : [
                  marker,
                  '',
                  `Flight Deal Brief build passed for \`${run.head_branch}\`.`,
                  '',
                  'Set the repository variable `STREAMLIT_APP_URL` to have this workflow post the deployed Streamlit app link automatically.',
                  '',
                  `Workflow run: ${run.html_url}`,
                ]).join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing PR comment ${existing.id}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
            core.info(`Created PR comment on #${pr.number}.`);
